name: ci-cd

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: eu-central-1
  IMAGE_PREFIX: rg-p2-

jobs:
  build:
    # pull requests only prove that the images still build; nothing is pushed
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build images (amd64 only, no push)
        run: |
          scripts/rg-build-images.sh --tag="0.0.0-pr.${GITHUB_RUN_NUMBER}" --platforms=linux/amd64

  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      vote: ${{ steps.build.outputs.vote_image_tag }}
      result: ${{ steps.build.outputs.result_image_tag }}
      worker: ${{ steps.build.outputs.worker_image_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Tool versions
        run: |
          podman --version
          skopeo --version
          podman build --help | grep -E -- '--(manifest|platform)\b'

      - name: Install qemu-user-static for the arm64 build
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-user-static
          if [[ ! -e /proc/sys/fs/binfmt_misc/qemu-aarch64 ]]; then
            sudo systemctl restart systemd-binfmt
          fi
          test -e /proc/sys/fs/binfmt_misc/qemu-aarch64
          head -n 3 /proc/sys/fs/binfmt_misc/qemu-aarch64

      - name: Compute the image tag
        id: tag
        run: |
          ver=$(<VERSION)
          if [[ $GITHUB_REF_NAME == main ]]; then
            tag=$ver
          else
            tag=$ver-dev.$GITHUB_RUN_NUMBER
          fi
          printf 'image tag: %s\n' "$tag"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - name: Show the OIDC claims GitHub will send
        continue-on-error: true
        run: |
          tok=$(curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          p=$(cut -d. -f2 <<<"$tok" | tr '_-' '/+')
          while (( ${#p} % 4 )); do p+==; done
          base64 -d <<<"$p" | jq '{sub, aud, ref}'

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.RG_P2_PUSH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR with podman
        env:
          REGISTRY: ${{ vars.RG_P2_ECR_REGISTRY }}
        run: |
          echo "REGISTRY_AUTH_FILE=$RUNNER_TEMP/containers-auth.json" >> "$GITHUB_ENV"
          export REGISTRY_AUTH_FILE=$RUNNER_TEMP/containers-auth.json
          aws ecr get-login-password --region "$AWS_REGION" |
            podman login --username AWS --password-stdin "$REGISTRY"

      - name: Build, push and verify
        id: build
        env:
          REGISTRY: ${{ vars.RG_P2_ECR_REGISTRY }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          scripts/rg-build-images.sh --registry="$REGISTRY" --prefix="$IMAGE_PREFIX" \
            --tag="$TAG" --push --resume | tee "$RUNNER_TEMP/pins.env"
          sed -E 's/^([A-Z_]+)=/\L\1=/' "$RUNNER_TEMP/pins.env" >> "$GITHUB_OUTPUT"
          {
            echo '### Published images'
            echo '```text'
            cat "$RUNNER_TEMP/pins.env"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove registry credentials
        if: always()
        run: |
          [[ -z ${REGISTRY_AUTH_FILE:-} ]] || rm -f -- "$REGISTRY_AUTH_FILE"

  deploy:
    # the deploy role trusts only refs/heads/main: do not add an environment: here, it changes the sub
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-eks
      cancel-in-progress: false
    env:
      CLUSTER: eks-rolando-p2
      NAMESPACE: rg-app
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.RG_P2_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl within one minor of the cluster
        run: |
          set -euo pipefail
          minor=$(aws eks describe-cluster --name "$CLUSTER" --query cluster.version --output text)
          ver=$(curl -fsSL "https://dl.k8s.io/release/stable-${minor}.txt")
          printf 'cluster %s, kubectl %s\n' "$minor" "$ver"
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP/bin"
          curl -fsSLO "https://dl.k8s.io/release/${ver}/bin/linux/amd64/kubectl"
          curl -fsSL "https://dl.k8s.io/release/${ver}/bin/linux/amd64/kubectl.sha256" -o kubectl.sha256
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
          chmod +x kubectl
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      - name: Open the API allow-list for this runner
        run: scripts/rg-ci-allowlist.sh open

      - name: Roll out the new images
        env:
          REGISTRY: ${{ vars.RG_P2_ECR_REGISTRY }}
          VOTE: ${{ needs.publish.outputs.vote }}
          RESULT: ${{ needs.publish.outputs.result }}
          WORKER: ${{ needs.publish.outputs.worker }}
        run: |
          set -euo pipefail
          [[ -n $VOTE && -n $RESULT && -n $WORKER ]] || { echo 'missing image pins'; exit 1; }
          kubectl version --client
          aws eks update-kubeconfig --name "$CLUSTER" --region "$AWS_REGION" --kubeconfig "$KUBECONFIG"
          for i in $(seq 1 12); do
            kubectl -n "$NAMESPACE" get deployments && break
            [[ $i -lt 12 ]] || exit 1
            sleep 10
          done
          kubectl -n "$NAMESPACE" set image deployment/vote "vote=$REGISTRY/${IMAGE_PREFIX}vote:$VOTE"
          kubectl -n "$NAMESPACE" set image deployment/result "result=$REGISTRY/${IMAGE_PREFIX}result:$RESULT"
          kubectl -n "$NAMESPACE" set image deployment/worker "worker=$REGISTRY/${IMAGE_PREFIX}worker:$WORKER"
          for d in vote result worker; do
            kubectl -n "$NAMESPACE" rollout status "deployment/$d" --timeout=300s
          done
          {
            echo '### Deployed'
            echo '```text'
            kubectl -n "$NAMESPACE" get deployments \
              -o custom-columns=NAME:.metadata.name,IMAGE:.spec.template.spec.containers[0].image
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Restore the API allow-list
        if: always()
        run: scripts/rg-ci-allowlist.sh restore
