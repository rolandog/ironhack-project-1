---
- name: Base (all AWS hosts)
  hosts: aws
  become: true
  vars:
    rg_user: rgapp
    rg_swap: 1G   # t4g.nano has 512 MiB
  tasks:
    - ansible.builtin.include_tasks: tasks/check-secrets.yml

    - name: Install rootless Podman and helpers
      ansible.builtin.apt:
        name: [podman, uidmap, passt, netavark, aardvark-dns, dbus-user-session, acl]
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create the unprivileged service user
      ansible.builtin.user:
        name: "{{ rg_user }}"
        shell: /bin/bash
        create_home: true
      register: rg_account

    - name: Assert the user has subuid and subgid ranges
      ansible.builtin.shell: grep -q '^{{ rg_user }}:' /etc/subuid && grep -q '^{{ rg_user }}:' /etc/subgid
      changed_when: false

    - name: Keep the user manager running without a login (linger)
      ansible.builtin.command: loginctl enable-linger {{ rg_user }}
      args:
        creates: /var/lib/systemd/linger/{{ rg_user }}

    - name: Wait for the user bus
      ansible.builtin.wait_for:
        path: "/run/user/{{ rg_account.uid }}/bus"
        timeout: 30

    - name: Create and format the swap file
      ansible.builtin.shell: |
        set -e
        fallocate -l {{ rg_swap }} /swapfile
        chmod 600 /swapfile
        mkswap /swapfile
      args:
        creates: /swapfile

    - name: Persist swap in fstab
      ansible.posix.mount:
        path: none
        src: /swapfile
        fstype: swap
        opts: sw
        state: present

    - name: Enable swap now
      ansible.builtin.command: swapon /swapfile
      when: ansible_facts['swaptotal_mb'] | int == 0

- name: Database tier (postgres, volume)
  hosts: db
  become: true
  vars:
    rg_user: rgapp
    rg_db_tag: 18.6-alpine3.24@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
    rg_secret_env:
      POSTGRES_PASSWORD: "{{ rg_db_password }}"
    rg_services: [db]
    rg_quadlets:
      pgdata.volume: |
        [Volume]
      db.container: |
        [Unit]
        Description=Postgres (rootless)

        [Container]
        ContainerName=db
        Image=docker.io/library/postgres:{{ rg_db_tag }}
        Environment=POSTGRES_USER=postgres
        EnvironmentFile={{ rg_env_file }}
        Volume=pgdata.volume:/var/lib/postgresql
        PublishPort=5432:5432

        [Service]
        Restart=always
        RestartSec=5
        TimeoutStartSec=600

        [Install]
        WantedBy=default.target
    allow_world_readable_tmpfiles: true
  tasks:
    - ansible.builtin.include_tasks: tasks/quadlet.yml

- name: Backend tier (redis, worker)
  hosts: backend
  become: true
  vars:
    rg_user: rgapp
    rg_hub: docker.io/rolandog
    rg_redis_tag: 8.10.2-alpine3.23@sha256:0bf6577d7774e592b29d093e3ac9390eb91e13d72c21e506afce736de5e0eeb0
    rg_worker_tag: "0.2.0@sha256:09104a66c7405f5ab90b0129524475c9c997bbb7e3dd0d87f432adb618169802"
    rg_services: [redis, worker]
    rg_secret_env:
      DB_PASSWORD: "{{ rg_db_password }}"
    rg_quadlets:
      rg.network: |
        [Network]
      redis.container: |
        [Unit]
        Description=Redis (rootless)

        [Container]
        ContainerName=redis
        Image=docker.io/library/redis:{{ rg_redis_tag }}
        Network=rg.network
        PublishPort=6379:6379

        [Service]
        Restart=always
        RestartSec=5
        TimeoutStartSec=600

        [Install]
        WantedBy=default.target
      worker.container: |
        [Unit]
        Description=Worker (rootless)
        After=redis.service
        Wants=redis.service

        [Container]
        ContainerName=worker
        Image={{ rg_hub }}/worker:{{ rg_worker_tag }}
        Environment=VOTING_MODE={{ rg_voting_mode }}
        EnvironmentFile={{ rg_env_file }}
        Network=rg.network
        AddHost=db:{{ hostvars['rg-vm3'].ansible_host }}

        [Service]
        Restart=always
        RestartSec=5
        TimeoutStartSec=600

        [Install]
        WantedBy=default.target
  tasks:
    - ansible.builtin.include_tasks: tasks/quadlet.yml

- name: Frontend tier (vote, result)
  hosts: frontend
  become: true
  vars:
    rg_user: rgapp
    rg_hub: docker.io/rolandog
    rg_vote_tag: "0.2.0@sha256:44ac3184b13674227cad06a165096018269f31e57c5def4b667ee8608ebe2d28"
    rg_result_tag: "1.2.1@sha256:9b1b551a5642399065139841c859de0f15f675e6141bb0396dd41c27b6490f56"
    rg_services: [vote, result]
    rg_secret_env:
      PG_PASSWORD: "{{ rg_db_password }}"
    rg_quadlets:
      vote.container: |
        [Unit]
        Description=Vote (rootless)

        [Container]
        ContainerName=vote
        Image={{ rg_hub }}/vote:{{ rg_vote_tag }}
        Sysctl=net.ipv4.ip_unprivileged_port_start=0
        Environment=VOTING_MODE={{ rg_voting_mode }}
        AddHost=redis:{{ hostvars['rg-vm2'].ansible_host }}
        PublishPort=80:80

        [Service]
        Restart=always
        RestartSec=5
        TimeoutStartSec=600

        [Install]
        WantedBy=default.target
      result.container: |
        [Unit]
        Description=Result (rootless)

        [Container]
        ContainerName=result
        Image={{ rg_hub }}/result:{{ rg_result_tag }}
        Sysctl=net.ipv4.ip_unprivileged_port_start=0
        EnvironmentFile={{ rg_env_file }}
        AddHost=db:{{ hostvars['rg-vm3'].ansible_host }}
        PublishPort=8081:80

        [Service]
        Restart=always
        RestartSec=5
        TimeoutStartSec=600

        [Install]
        WantedBy=default.target
  tasks:
    # why: rootless containers cannot publish port 80 otherwise
    - name: Allow unprivileged processes to bind port 80 and up
      ansible.posix.sysctl:
        name: net.ipv4.ip_unprivileged_port_start
        value: "80"
        sysctl_file: /etc/sysctl.d/90-rg-unprivileged-ports.conf
        reload: true

    - ansible.builtin.include_tasks: tasks/quadlet.yml
