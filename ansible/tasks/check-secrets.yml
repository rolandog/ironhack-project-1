---
# why: fail before any host changes when the secret or the mode is unusable
- name: Check the controller-side secret and voting mode
  run_once: true
  ansible.builtin.fail:
    msg: "export RG_DB_PASSWORD (hex, 32 or more characters) and a valid VOTING_MODE (every-click or one-per-voter) first"
  when: "rg_db_password is not match('^[A-Za-z0-9]{32,}$') or rg_voting_mode not in ['every-click', 'one-per-voter']"
