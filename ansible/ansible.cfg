[defaults]
inventory = hosts.ini
# complements ansible_python_interpreter=/usr/bin/python3 in hosts.ini
interpreter_python = /usr/bin/python3
retry_files_enabled = False

[ssh_connection]
# why: becoming an unprivileged user (rgapp) needs pipelining or setfacl
pipelining = True
# run ansible from ansible/ so this relative path is the same known_hosts as hosts.ini
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=known_hosts
