# Own images from Docker Hub, fully qualified for podman.
# Usage: cp .env.example .env, set DB_PASSWORD and DOCKERHUB_USER, then: podman compose up -d
# DB_PASSWORD is required: letters and digits only, because result builds a URL from it.
services:
  vote:
    image: docker.io/${DOCKERHUB_USER:?set DOCKERHUB_USER in .env}/vote:${VOTE_IMAGE_TAG:?copy .env.example to .env}
    sysctls:
      - net.ipv4.ip_unprivileged_port_start=0
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      VOTING_MODE: ${VOTING_MODE:-every-click}
    networks:
      - back-tier

  result:
    image: docker.io/${DOCKERHUB_USER:?set DOCKERHUB_USER in .env}/result:${RESULT_IMAGE_TAG:?copy .env.example to .env}
    sysctls:
      - net.ipv4.ip_unprivileged_port_start=0
    environment:
      PG_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in a .env file next to docker-compose.yml}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:80"
    networks:
      - back-tier

  worker:
    image: docker.io/${DOCKERHUB_USER:?set DOCKERHUB_USER in .env}/worker:${WORKER_IMAGE_TAG:?copy .env.example to .env}
    environment:
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in a .env file next to docker-compose.yml}
      VOTING_MODE: ${VOTING_MODE:-every-click}
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - back-tier

  redis:
    image: docker.io/library/redis:${REDIS_IMAGE_TAG:?copy .env.example to .env}
    volumes:
      - "./healthchecks:/healthchecks"
    healthcheck:
      test: /healthchecks/redis.sh
      interval: "5s"
    networks:
      - back-tier

  db:
    image: docker.io/library/postgres:${POSTGRES_IMAGE_TAG:?copy .env.example to .env}
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in a .env file next to docker-compose.yml}
    volumes:
      - "db-data:/var/lib/postgresql"
      - "./healthchecks:/healthchecks"
    healthcheck:
      test: /healthchecks/postgres.sh
      interval: "5s"
    networks:
      - back-tier

volumes:
  db-data:

networks:
  back-tier:
