# Own images from Docker Hub, fully qualified for podman.
# Usage: DOCKERHUB_USER=<user> podman-compose -f docker-compose.rg.yml up -d
services:
  vote:
    image: docker.io/${DOCKERHUB_USER}/vote:${IMAGE_TAG:-0.1.0}
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8080:80"
    networks:
      - back-tier

  result:
    image: docker.io/${DOCKERHUB_USER}/result:${IMAGE_TAG:-0.1.0}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:80"
    networks:
      - back-tier

  worker:
    image: docker.io/${DOCKERHUB_USER}/worker:${IMAGE_TAG:-0.1.0}
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - back-tier

  redis:
    image: docker.io/library/redis:alpine
    volumes:
      - "./healthchecks:/healthchecks"
    healthcheck:
      test: /healthchecks/redis.sh
      interval: "5s"
    networks:
      - back-tier

  db:
    image: docker.io/library/postgres:15-alpine
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
    volumes:
      - "db-data:/var/lib/postgresql/data"
      - "./healthchecks:/healthchecks"
    healthcheck:
      test: /healthchecks/postgres.sh
      interval: "5s"
    networks:
      - back-tier

volumes:
  db-data:

networks:
  back-tier:
