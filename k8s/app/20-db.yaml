apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: rg-app
  labels:
    app.kubernetes.io/name: db
    app.kubernetes.io/part-of: rg-voting-app
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  namespace: rg-app
  labels:
    app.kubernetes.io/name: db
    app.kubernetes.io/part-of: rg-voting-app
spec:
  serviceName: db
  replicas: 1
  # lab teardown: deleting the StatefulSet also deletes the EBS volume
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Delete
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db
        app.kubernetes.io/part-of: rg-voting-app
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: docker.io/library/postgres:18.6-alpine3.24@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rg-db
                  key: POSTGRES_PASSWORD
          volumeMounts:
            # postgres 18+ image: PGDATA defaults to a versioned subdirectory of this mount
            - name: data
              mountPath: /var/lib/postgresql
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-h", "127.0.0.1"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-h", "127.0.0.1"]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: db
          app.kubernetes.io/part-of: rg-voting-app
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: rg-gp3
        resources:
          requests:
            storage: 2Gi
