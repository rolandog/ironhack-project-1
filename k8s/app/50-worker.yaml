apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: rg-app
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: rg-voting-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
        app.kubernetes.io/part-of: rg-voting-app
    spec:
      # a Service named redis injects REDIS_PORT=tcp://..., which the apps parse as an int
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: docker.io/rolandog/worker:0.2.0@sha256:09104a66c7405f5ab90b0129524475c9c997bbb7e3dd0d87f432adb618169802
          env:
            - name: REDIS_HOST
              value: redis
            - name: DB_HOST
              value: db
            - name: DB_USERNAME
              value: postgres
            - name: DB_NAME
              value: postgres
            - name: VOTING_MODE
              value: every-click
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rg-db
                  key: DB_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
